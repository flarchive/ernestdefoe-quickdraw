# composer.json, PHP 8.3 syntax (the oldest PHP Flarum 2 supports), and the JS
# checks and production build, including that the committed js/dist matches a
# fresh build. Quickdraw has no server code beyond extend.php, so there is no
# test suite or PHPStan run.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/screenshots/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP 8.3 syntax
        run: php -l extend.php

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: JS checks and production build
        working-directory: js
        run: |
          npm ci
          npm run format-check
          npm run build

      # js/dist is committed and is what forums load. If a build from the
      # committed source produces different bytes, the shipped bundle is not
      # the shipped source.
      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- js/dist; then
            echo "js/dist differs from a fresh build of js/src: run 'npm run build' in js/ and commit." >&2
            git diff --stat -- js/dist
            exit 1
          fi
